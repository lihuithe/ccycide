[package]
name = "rterm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rterm-proto = { path = "../rterm-proto" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
prost = "0.14"
argon2 = "0.6"
spake2 = "0.4"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
# zeroize：Drop 时清零 AEAD 内部持有的会话密钥（审查 L8）
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
ed25519-dalek = "3"
rand = "0.10"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
serde_json = "1"
base64 = "0.22"
directories = "6"
keyring = "4"
url = "2"
webpki-roots = "1"
rustls-native-certs = "0.8"
rustls-pki-types = "1"
percent-encoding = "2"
portable-pty = "0.9"
vte = "0.15"
regex = "1.13.1"
semver = "1.0.28"
ulid = "3.0.0"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
interprocess = { version = "2.4.8", features = ["tokio"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "ansi"] }
tracing-appender = "0.2.5"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console"] }
winreg = "0.56"
widestring = "1"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3"
vt100 = "0.15"
